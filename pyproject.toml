[project]
name = "applicant"
version = "0.1.0"
description = "Scrapes applicable job postings, applies to them, and looks up company ratings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # pinned: src/utils/linkedin.py uses the Selenium 3 find_element_by_* API
    "selenium==3.141.0",
    # selenium 3 calls resp.getheader(), which urllib3 2.x dropped
    "urllib3<2",
    "httpx>=0.27",
    "playwright>=1.44",
]

[tool.uv]
# an application, not a distributable package - nothing to build or install
package = false
