[project]
name = "applicant"
dynamic = ["version"]
description = "Scrapes applicable job postings, applies to them, and looks up company ratings and financials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.44",
    "pydantic>=2",
    # applicant.toml on Python 3.10; 3.11+ has tomllib in the standard library
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
applicant = "applicant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# single source: __version__ in the package
path = "src/applicant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/applicant"]

[dependency-groups]
# local parity with the pinned versions CI runs through uvx
dev = [
    # property-based fuzzing of the parsers that read scraped text
    "hypothesis>=6.168",
    "pytest>=8.3",
    "pyright>=1.1.400",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# unittest.TestCase throughout, so `python -m unittest` works with nothing installed
python_files = ["test_*.py"]
addopts = "-ra"

# `uv run --with coverage coverage run -m pytest tests && uv run --with coverage
# coverage report` - CI's coverage job runs exactly this, and fails under the floor
[tool.coverage.run]
branch = true
source = ["src/applicant"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# a one-off mutation pass, not run in CI (see docs/mutation-report.md):
# uv run --with mutmut mutmut run && uv run --with mutmut mutmut results
[tool.mutmut]
paths_to_mutate = ["src/applicant/domain/", "src/applicant/services/"]
tests_dir = ["tests/"]
also_copy = ["src/applicant/", ".github/", "tools/"]
# the live tier needs a browser, and the workflow checks git, which mutants/ is not
pytest_add_cli_args = ["-p", "no:cacheprovider", "--ignore=tests/test_live_pages.py", "--ignore=tests/test_ci_workflows.py", "-x", "-q"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "error"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    # long lines live in docstrings and regexes; the formatter owns wrapping
    "E501",
    # the codebase uses .format() consistently; converting is churn, not a fix
    "UP032",
    # ₹, en dashes and bullets are the actual characters these boards emit,
    # and the parsers match on them deliberately
    "RUF001",
    "RUF002",
    "RUF003",
]
# PTH is deliberately not selected: these modules pass paths around as strings and
# open() is used consistently: migrating to pathlib is churn, not a fix.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "single"
