[project]
name = "applicant"
dynamic = ["version"]
description = "Scrapes applicable job postings, applies to them, and looks up company ratings and financials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "iso3166==3.0.0",
    "iso4217==1.16.20260101",
    "playwright>=1.44",
    "pydantic>=2",
    # applicant.toml on Python 3.10; 3.11+ has tomllib in the standard library
    "tomli>=2; python_version < '3.11'",
    "tzdata==2026.6",
]

[project.scripts]
applicant = "applicant.cli:entrypoint"

[project.optional-dependencies]
pdf = [
    "fonttools>=4.65.0",
    "pypdf>=7.0.0",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# single source: __version__ in the package
path = "src/applicant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/applicant"]

[dependency-groups]
# CI and local runs share these tools through uv.lock
dev = [
    # property-based fuzzing of the parsers that read scraped text
    "hypothesis>=6.168",
    "pytest>=8.3",
    "pyright==1.1.411",
    "ruff==0.16.1",
    "coverage>=7.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# unittest.TestCase throughout, so `python -m unittest` works with nothing installed
python_files = ["test_*.py"]
addopts = "-ra"

# Run coverage combine after measuring the suite, then coverage report.
[tool.coverage.run]
branch = true
source = ["src/applicant"]
relative_files = true
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.paths]
source = [
    "src/",
    "*/work/Applicant/Applicant/src/",
    "*/a/Applicant/Applicant/src/",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# a one-off mutation pass, not run in CI (see docs/mutation-report.md):
# uv run --with mutmut mutmut run && uv run --with mutmut mutmut results
[tool.mutmut]
paths_to_mutate = ["src/applicant/domain/", "src/applicant/services/"]
tests_dir = ["tests/"]
also_copy = ["src/applicant/", ".github/", "tools/"]
# the live tier needs a browser, and the workflow checks git, which mutants/ is not
pytest_add_cli_args = ["-p", "no:cacheprovider", "--ignore=tests/test_live_pages.py", "--ignore=tests/test_ci_workflows.py", "-x", "-q"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
strict = ["src/applicant/cli/dispatch.py", "src/applicant/cli/status.py", "src/applicant/cli/benchmark.py", "src/applicant/cli/database.py", "src/applicant/cli/company_evidence.py", "src/applicant/cli/feedback.py", "src/applicant/cli/personalize.py", "src/applicant/cli/evaluate.py", "src/applicant/cli/survey.py", "src/applicant/cli/rank.py", "src/applicant/cli/search.py", "src/applicant/cli/apply.py", "src/applicant/cli/jobs.py", "src/applicant/cli/reviews.py", "src/applicant/cli/financials.py", "src/applicant/cli/rates.py"]
reportMissingImports = "error"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    # long lines live in docstrings and regexes; the formatter owns wrapping
    "E501",
    # the codebase uses .format() consistently; converting is churn, not a fix
    "UP032",
    # ₹, en dashes and bullets are the actual characters these boards emit,
    # and the parsers match on them deliberately
    "RUF001",
    "RUF002",
    "RUF003",
]
# PTH is deliberately not selected: these modules pass paths around as strings and
# open() is used consistently: migrating to pathlib is churn, not a fix.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "single"
