[project]
name = "applicant"
version = "0.1.0"
description = "Scrapes applicable job postings, applies to them, and looks up company ratings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.44",
    "pydantic>=2",
]

[project.scripts]
applicant = "applicant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applicant"]

[dependency-groups]
# local parity with the pinned versions CI runs through uvx
dev = [
    "pytest>=8.3",
    "pyright>=1.1.400",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# unittest.TestCase throughout, so `python -m unittest` works with nothing installed
python_files = ["test_*.py"]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "error"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    # long lines live in docstrings and regexes; the formatter owns wrapping
    "E501",
    # the codebase uses .format() consistently; converting is churn, not a fix
    "UP032",
    # ₹, en dashes and bullets are the actual characters these boards emit,
    # and the parsers match on them deliberately
    "RUF001",
    "RUF002",
    "RUF003",
]
# PTH is deliberately not selected: these modules pass paths around as strings and
# open() is used consistently: migrating to pathlib is churn, not a fix.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "single"
