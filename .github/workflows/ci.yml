# Everything here reports; only broken behaviour gates.
#
# Each job runs its tool and records the real outcome as a job output. `types`,
# `unit`, `coverage` and `browser` then fail when their tool did: a type error,
# a failing test, coverage under the floor in pyproject.toml, or a browser
# source that no longer reads its saved pages is a broken program - and a red
# run that reads green is how master stayed broken unnoticed after a bad merge.
# Lint findings and format drift stay report-only - style never blocks a merge.
# The `status` job collects every outcome into one summary and one artifact, and
# fails if any gate did, so it is the single check to mark as required.
#
# Formatting is the one thing that writes, and it lives in format.yml. Its push
# starts no workflow of its own, so format.yml dispatches this one for the
# formatted commit - otherwise that head would never get a `status` check.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: 0.16.1
  PYRIGHT_VERSION: 1.1.411

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.ruff.outputs.outcome }}
      detail: ${{ steps.ruff.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff check
        id: ruff
        run: |
          # --output-format=github puts each finding on the diff as an annotation
          uvx "ruff@${RUFF_VERSION}" check --output-format=github . && code=0 || code=$?
          uvx "ruff@${RUFF_VERSION}" check --output-format=concise . > findings.txt 2>&1 || true

          if [ "$code" -eq 0 ]; then
            echo 'outcome=pass' >> "$GITHUB_OUTPUT"
            echo 'detail=clean' >> "$GITHUB_OUTPUT"
            echo '### ✅ ruff check: clean' >> "$GITHUB_STEP_SUMMARY"
          else
            count=$(grep -c . findings.txt || true)
            echo 'outcome=fail' >> "$GITHUB_OUTPUT"
            echo "detail=${count} finding(s)" >> "$GITHUB_OUTPUT"
            printf '### ⚠️ ruff check: %s finding(s)\n\n```\n' "$count" >> "$GITHUB_STEP_SUMMARY"
            head -50 findings.txt >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: format drift
        run: |
          if uvx "ruff@${RUFF_VERSION}" format --check . > /dev/null 2>&1; then
            echo 'Formatting is current.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Formatting is stale - the `format` workflow pushes the fix.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-findings
          path: findings.txt
          retention-days: 30

  types:
    name: types (pyright, python 3.10 + 3.12)
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.pyright.outputs.outcome }}
      detail: ${{ steps.pyright.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # without the venv every `import httpx` is an unresolved import and the
      # whole run says nothing useful
      - name: Install dependencies
        run: uv sync

      # Checked against the floor requires-python claims and against 3.12, where
      # the stdlib typeshed differs (deprecations, removed aliases). One job and
      # one step, not a matrix: `status` reads a single outcome per job, and a
      # matrix would let the last version to finish overwrite the others.
      - name: pyright
        id: pyright
        env:
          PYRIGHT_PYTHONS: '3.10 3.12'
        run: |
          failed=0
          details=''
          for version in $PYRIGHT_PYTHONS; do
            report="pyright-${version}.json"
            uvx "pyright@${PYRIGHT_VERSION}" --pythonversion "$version" --outputjson \
              > "$report" || true
            echo "#### Python ${version}" >> "$GITHUB_STEP_SUMMARY"
            python .github/scripts/ci_report.py pyright "$report"

            errors=$(python -c "import json; print(json.load(open('$report'))['summary']['errorCount'])")
            [ "$errors" -eq 0 ] || failed=1
            details="${details:+$details, }${version}: ${errors}"
          done

          if [ "$failed" -eq 0 ]; then
            echo 'outcome=pass' >> "$GITHUB_OUTPUT"
            echo "detail=no type errors (${PYRIGHT_PYTHONS// /, })" >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=fail' >> "$GITHUB_OUTPUT"
            echo "detail=type errors by python - ${details}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyright-report
          path: pyright-*.json
          retention-days: 30

  unit:
    name: unit (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.pytest.outputs.outcome }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is here because requires-python claims it; raise the floor rather
        # than keep testing a version nobody supports
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }}

      # the suite is unittest.TestCase throughout; pytest is here for the reporting.
      # The real-browser tier is the browser job's: here it would only skip, and
      # be counted as skipped once per Python version
      - name: pytest
        id: pytest
        run: |
          # any non-zero exit fails the job: 1 is failing tests, and 2-5 are a
          # session that was interrupted, crashed or collected nothing - all of
          # which mean the suite did not actually vouch for this commit
          if uv run pytest tests -v --ignore=tests/test_live_pages.py \
            --junitxml="junit-${{ matrix.python }}.xml"; then
            echo 'outcome=pass' >> "$GITHUB_OUTPUT"
          else
            code=$?
            echo 'outcome=fail' >> "$GITHUB_OUTPUT"
            echo "pytest exited ${code}" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      # proves the suite still runs on the stdlib runner alone, which is what a
      # contributor has before installing anything
      - name: unittest discover
        run: uv run python -m unittest discover -s tests -t . || true

      - name: Summarise
        if: always()
        run: python .github/scripts/ci_report.py junit 'junit-*.xml'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python }}
          path: junit-*.xml
          retention-days: 30

  # The suite under coverage, once: the floor is `fail_under` in pyproject.toml,
  # so this and a local `coverage report` agree. The browser tier skips here -
  # the floor never depends on a browser being installed.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.coverage.outputs.outcome }}
      detail: ${{ steps.coverage.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: coverage
        id: coverage
        run: |
          if ! uv run --with coverage coverage run -m pytest tests -q; then
            echo 'outcome=fail' >> "$GITHUB_OUTPUT"
            echo 'detail=the suite failed under coverage' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          uv run --with coverage coverage xml -q
          total=$(uv run --with coverage coverage report --format=total)
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          # exits 2 under fail_under; the table is written either way
          if uv run --with coverage coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"; then
            echo 'outcome=pass' >> "$GITHUB_OUTPUT"
            echo "detail=${total}% line and branch" >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=fail' >> "$GITHUB_OUTPUT"
            echo "detail=${total}%, under the floor" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 30

  # The browser sources in a real Chromium against tests/fixtures/pages: the
  # selectors, the page's own API calls, lazy loading. Nothing reaches the
  # network. APPLICANT_BROWSER_TESTS turns "no browser, skip" into a failure.
  browser:
    name: browser (real Chromium)
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.pytest.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --python 3.12
          uv run playwright install --with-deps chromium

      - name: pytest
        id: pytest
        env:
          APPLICANT_BROWSER_TESTS: '1'
        run: |
          if uv run pytest tests/test_live_pages.py -v --junitxml=junit-browser.xml; then
            echo 'outcome=pass' >> "$GITHUB_OUTPUT"
          else
            code=$?
            echo 'outcome=fail' >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      - name: Summarise
        if: always()
        run: python .github/scripts/ci_report.py junit 'junit-browser.xml'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-browser
          path: junit-browser.xml
          retention-days: 30

  status:
    name: status
    runs-on: ubuntu-latest
    needs: [lint, types, unit, coverage, browser]
    # the whole point of this job is to record failures, so it must run regardless
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: reports
          merge-multiple: true

      # `result` is how the job ran (success/failure/skipped/cancelled) and
      # `outcome` is what its tool actually said. Both matter: a skipped job is
      # not a passing one.
      - name: Collect
        env:
          JOBS: |
            {
              "lint":  {"result": "${{ needs.lint.result }}",
                        "outcome": "${{ needs.lint.outputs.outcome }}",
                        "detail": "${{ needs.lint.outputs.detail }}"},
              "types": {"result": "${{ needs.types.result }}",
                        "outcome": "${{ needs.types.outputs.outcome }}",
                        "detail": "${{ needs.types.outputs.detail }}"},
              "unit":  {"result": "${{ needs.unit.result }}",
                        "outcome": "${{ needs.unit.outputs.outcome }}",
                        "detail": ""},
              "coverage": {"result": "${{ needs.coverage.result }}",
                           "outcome": "${{ needs.coverage.outputs.outcome }}",
                           "detail": "${{ needs.coverage.outputs.detail }}"},
              "browser": {"result": "${{ needs.browser.result }}",
                          "outcome": "${{ needs.browser.outputs.outcome }}",
                          "detail": ""}
            }
        run: |
          printf '%s' "$JOBS" > jobs.json
          python .github/scripts/ci_report.py status \
            --jobs jobs.json --junit 'reports/junit-*.xml' --out status.json

      - uses: actions/upload-artifact@v4
        with:
          name: ci-status
          path: status.json
          retention-days: 90

      # After the record is written, so a failing run still leaves its summary.
      # `result` rather than `outputs.outcome` for unit: a matrix job's output is
      # whichever version finished last, while its result covers all of them.
      - name: Gate
        env:
          TYPES: ${{ needs.types.result }}
          UNIT: ${{ needs.unit.result }}
          COVERAGE: ${{ needs.coverage.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "types: ${TYPES}, unit: ${UNIT}, coverage: ${COVERAGE}, browser: ${BROWSER}"
          [ "$TYPES" = success ] && [ "$UNIT" = success ] \
            && [ "$COVERAGE" = success ] && [ "$BROWSER" = success ]
